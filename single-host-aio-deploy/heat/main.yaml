- name: Heat setup
  vars_files:
    - ../vars.yaml
  hosts: localhost
  remote_user: root
  connection: local
  tasks:
    - name: Create heat configuration folder
      ansible.builtin.file:
        path: /etc/kolla/config/heat
        state: directory
        mode: '0644'
    - name: Copy 
      become: true
      ansible.builtin.copy:
        src: heat.conf
        dest: /etc/kolla/config/heat/heat.conf
        mode: '0644'