- name: Configuring Octavia service settings
  vars_files: vars.yml
  hosts: localhost
  remote_user: root
  connection: local
  tasks:
    - name: Enable Octavia 1.0
      become: true
      ansible.builtin.replace:
        path: /etc/kolla/globals.yml
        regexp: '#enable_octavia: false'
        replace: |
          enable_octavia: true
          # octavia_network_type: "tenant"
          octavia_interface_wait_timeout: 30
    - name: Define octavia amphora flavor
      become: true
      ansible.builtin.replace:
        path: /etc/kolla/globals.yml
        regexp: '(?m)^#octavia_amp_flavor:\n#  name: "amphora"\n#  is_public: no\n#  vcpus: 1\n#  ram: 1024\n#  disk: 5$'
        replace: |
          octavia_amp_flavor:
            name: "amphora"
            is_public: no
            vcpus: 1
            ram: 1024
            disk: 5
    - name: Define octavia amphora network
      become: true
      ansible.builtin.replace:
        path: /etc/kolla/globals.yml
        regexp: '(?m)^#octavia_amp_network:\n#  name: lb-mgmt-net\n#  shared: false\n#  subnet:\n#    name: lb-mgmt-subnet\n#    cidr: "\{\{ octavia_amp_network_cidr \}\}"\n#    no_gateway_ip: yes\n#    enable_dhcp: yes$'
        replace: |
          octavia_amp_network:
            name: lb-mgmt-net
            provider_network_type: flat
            provider_physical_network: physnet1
            external: false
            shared: false
            subnet:
              name: lb-mgmt-subnet
              cidr: "10.0.0.0/24"
              allocation_pool_start: "10.0.0.100"
              allocation_pool_end: "10.0.0.200"
              gateway_ip: "10.0.0.1"
              enable_dhcp: true