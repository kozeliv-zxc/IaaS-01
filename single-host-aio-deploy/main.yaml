- name: Main deployment [Single host AIO - Debian 13]
  hosts: localhost
  gather_facts: true
  remote_user: root
  connection: local
  tasks:
    - name: x
      ansible.builtin.debug:
        msg: "x"

- name: Configuring globals.yml settings
  ansible.builtin.import_playbook: set-config.yaml

- name: Enable Cinder
  ansible.builtin.import_playbook: cinder/main.yaml

- name: Enable Octavia
  ansible.builtin.import_playbook: octavia/main.yaml

- name: AIO Deploy
  ansible.builtin.import_playbook: aio-deploy.yaml

- name: Host routing
  ansible.builtin.import_playbook: host-routing/main.yaml
