- name: Keystone setup
  vars_files:
    - ../vars.yaml
  hosts: localhost
  remote_user: root
  connection: local
  tasks:
    - name: Get admin ID
      openstack.cloud.identity_user_info:
        name: admin
        domain: Default
      register: admin_user_info
    - name: Check for admin name uniqueness
      ansible.builtin.assert:
        that:
          - admin_user_info.users | length == 1
        fail_msg: >-
          Expected exactly one admin in Default domain,
          but found {{ admin_user_info.users | length }}.
    - name: Create keystone configuration folder
      ansible.builtin.file:
        path: /etc/kolla/config/keystone
        state: directory
        mode: '0644'
    - name: Copy 
      become: true
      ansible.builtin.template:
        src: templates/policy.yaml.j2
        dest: "/etc/kolla/config/keystone/policy.yaml"
        owner: root
        group: root
        mode: '0644'
      vars:
        admin_id: "{{ admin_user_info.users[0].id }}"