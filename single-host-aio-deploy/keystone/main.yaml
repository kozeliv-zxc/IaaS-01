- name: Keystone setup
  vars_files:
    - ../vars.yaml
  hosts: localhost
  remote_user: root
  connection: local
  tasks:
    - name: Get heat_domain_admin ID
      openstack.cloud.identity_user_info:
        name: heat_domain_admin
        domain: heat_user_domain
      register: heat_user_info
    - name: Create keystone configuration folder
      ansible.builtin.file:
        path: /etc/kolla/config/keystone
        state: directory
        mode: '0644'
    - name: Copy 
      become: true
      ansible.builtin.template:
        src: templates/policy.yaml.j2
        dest: "/etc/kolla/config/keystone/policy.yaml"
        owner: root
        group: root
        mode: '0644'
      vars:
        heat_domain_admin_id: "{{ heat_user_info.users[0].id }}"