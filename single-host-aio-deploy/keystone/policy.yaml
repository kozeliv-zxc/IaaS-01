# List domains.
# GET  /v3/domains
# Intended scope(s): system, domain, project
"identity:list_domains": "(rule:admin_required and system_scope:all) or (role:reader and system_scope:all)"

# Create domain.
# POST  /v3/domains
# Intended scope(s): system, project
"identity:create_domain": "(rule:admin_required and system_scope:all)"

# Update domain.
# PATCH  /v3/domains/{domain_id}
# Intended scope(s): system, project
"identity:update_domain": "(rule:admin_required and system_scope:all)"

# Delete domain.
# DELETE  /v3/domains/{domain_id}
# Intended scope(s): system, project
"identity:delete_domain": "(rule:admin_required and system_scope:all)"

# List roles.
# GET  /v3/roles
# HEAD  /v3/roles
# Intended scope(s): system, domain, project
"identity:list_roles": "(rule:admin_required and system_scope:all) or (role:manager and not domain_id:None)"

# Create role.
# POST  /v3/roles
# Intended scope(s): system, project
"identity:create_role": "(rule:admin_required and system_scope:all)"

# Update role.
# PATCH  /v3/roles/{role_id}
# Intended scope(s): system, project
#"identity:update_role": "rule:admin_required"

# Delete role.
# DELETE  /v3/roles/{role_id}
# Intended scope(s): system, project
"identity:delete_role": "(rule:admin_required and system_scope:all)"
